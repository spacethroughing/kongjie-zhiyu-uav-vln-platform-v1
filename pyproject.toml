[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airsim-llm-harness"
version = "0.1.0"
description = "Safety-bounded LLM mission control harness for UE4.27 and AirSim"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
airsim-harness = "harness.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/harness"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["tests"]

